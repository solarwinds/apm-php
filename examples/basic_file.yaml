propagator:
  composite:
    - tracecontext:
    - baggage:

tracer_provider:
  sampler:
    solarwinds_json:
#    parent_based:
#      root:
#        always_on:
  processors:
    - batch:
        exporter:
          console:

meter_provider:
  readers:
    - periodic:
        exporter:
          console:

logger_provider:
  processors:
    - batch:
        exporter:
          console:
