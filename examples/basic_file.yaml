propagator:
  composite:
    - baggage:
    - tracecontext:
    - swotracestate:
    - xtraceoptions:

response_propagator/development:
  composite:
    - xtrace:
    - xtraceoptionsresponse:

tracer_provider:
  sampler:
    parent_based:
      root:
        solarwinds_http:
          service_key: "<token>:<service-name>"
          collector: "apm.collector.cloud.solarwinds.com"
          tracing_mode: true
          trigger_tracing_enabled: true
          transaction_settings:
            - tracing: "enabled"
              regex: "/^.*$/"
            - tracing: "disabled"
              regex: "/.*health.*/"
            - tracing: "disabled"
              regex: "/.*metrics.*/"
      remote_parent_sampled:
        solarwinds_http:
          service_key: "<token>:<service-name>"
          collector: "apm.collector.cloud.solarwinds.com"
          tracing_mode: true
          trigger_tracing_enabled: true
          transaction_settings:
            - tracing: "enabled"
              regex: "/^.*$/"
            - tracing: "disabled"
              regex: "/.*health.*/"
            - tracing: "disabled"
              regex: "/.*metrics.*/"
      remote_parent_not_sampled:
        solarwinds_http:
          service_key: "<token>:<service-name>"
          collector: "apm.collector.cloud.solarwinds.com"
          tracing_mode: true
          trigger_tracing_enabled: true
          transaction_settings:
            - tracing: "enabled"
              regex: "/^.*$/"
            - tracing: "disabled"
              regex: "/.*health.*/"
            - tracing: "disabled"
              regex: "/.*metrics.*/"

  processors:
    - batch:
        exporter:
          console:
#          otlp_http:
#            endpoint: "http://localhost:4318/v1/traces"

meter_provider:
  readers:
    - periodic:
        exporter:
          console:
